{% extends 'base.html' %}

{% block content %}
<div class="mb-4">
    <h1 class="font-bold mb-4" style="font-size: 1.5rem;">Profil Siswa</h1>
    
    <div class="card p-4 mb-4 text-center">
        <div style="width: 80px; height: 80px; background: var(--bg-color); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">
            <i data-lucide="user-round" aria-hidden="true"></i>
        </div>
        <h2 class="font-bold" style="font-size: 1.25rem;">{{ user.get_full_name }}</h2>
        <p class="text-muted mb-4">Kelas {{ profil.kelas }}</p>
        
        <div style="background: var(--primary-color); color: white; padding: 1rem; border-radius: 0.5rem; display: flex; justify-content: space-between; align-items: center;">
            <div style="text-align: left;">
                <div style="font-size: 0.875rem; opacity: 0.9;">Saldo Sekolah</div>
                <div class="font-bold" style="font-size: 1.5rem;">{{ profil.saldo_formatted }}</div>
            </div>
            <button class="btn" style="background: rgba(255,255,255,0.2); color: white;">Top Up</button>
        </div>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
        <div class="card p-4 text-center">
            <div class="font-bold text-primary" style="font-size: 1.5rem;">{{ total_pesanan }}</div>
            <div class="text-muted" style="font-size: 0.875rem;">Total Pesanan</div>
        </div>
        <div class="card p-4 text-center">
            <div class="font-bold" style="color: var(--success-color); font-size: 1.5rem;">{{ total_selesai }}</div>
            <div class="text-muted" style="font-size: 0.875rem;">Selesai</div>
        </div>
    </div>
    
    <div class="card mb-4">
        <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; cursor: pointer;">
            <span class="font-bold">Edit Profil</span>
            <span class="text-muted">›</span>
        </div>
        <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; cursor: pointer;">
            <span class="font-bold">Notifikasi</span>
            <span class="text-muted">›</span>
        </div>
        <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; cursor: pointer;">
            <span class="font-bold">Bantuan & FAQ</span>
            <span class="text-muted">›</span>
        </div>
    </div>
    
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline" style="width: 100%; color: var(--danger-color); border-color: var(--danger-color);">
            Keluar (Logout)
        </button>
    </form>
</div>
{% endblock %}
